<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="在浏览器里实时生成的水墨墨龙：为它点睛，引它戏珠，换晨昏雨雪，存图录片，全程程序化生成与合成音效。">
<meta property="og:title" content="山水墨龙">
<meta property="og:description" content="为墨龙点睛，引它戏珠。龙、山、云、风雨雷声全部由代码现场生成。">
<title>山水墨龙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: the whole screen is the painting; a narrow mounted label (题签) on the right holds the brush settings. */
:root {
  --paper: #EEF1EE;        /* cool xuan paper; follows the chosen palette */
  --paper-deep: #E2E7E3;
  --ink: #16181C;
  --ink-soft: #4A5058;
  --cinnabar: #B3261E;     /* seal red: the seal, the active choice and the eye-dotting brush only */
  --mineral: #1F7D86;      /* stone green, for slider fill */
  --rule: rgba(22, 24, 28, .14);
  --font-brush: "Ma Shan Zheng", "STXingkai", "Xingkai SC", "KaiTi", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage, #fx { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
body.pearl #stage canvas { cursor: crosshair; }
#fx { width: 100%; height: 100%; pointer-events: none; }
#grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }

.title { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: calc(20px + env(safe-area-inset-left, 0px));
  display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
.title h1 { margin: 0; font-family: var(--font-brush); font-weight: 400; font-size: clamp(34px, 5vw, 56px); line-height: 1.02;
  writing-mode: vertical-rl; letter-spacing: .04em; color: var(--ink); text-shadow: 0 0 18px var(--paper); }
.seal { margin-top: 6px; width: 30px; height: 30px; background: var(--cinnabar); color: #F4EFE3; display: grid; place-items: center;
  font-family: var(--font-brush); font-size: 20px; border-radius: 3px; }
.byline { position: fixed; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--ink-soft); max-width: 34ch; line-height: 1.6; pointer-events: none; margin: 0;
  padding: 8px 12px; background: color-mix(in srgb, var(--paper) 86%, transparent); border-left: 2px solid var(--ink); }

/* eye-dotting overlay */
#ring { position: fixed; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none;
  border: 2px solid var(--cinnabar); opacity: 0; transition: opacity .4s; }
body.sleeping #ring { opacity: .9; animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1.12); } }
.intro { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  display: none; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
body.sleeping .intro { display: flex; }
.intro p { margin: 0; font-size: 15px; color: var(--ink); background: color-mix(in srgb, var(--paper) 88%, transparent); padding: 6px 14px; }
.intro p small { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.dot { appearance: none; width: 74px; height: 74px; border-radius: 50%; border: 0; cursor: pointer; background: var(--cinnabar); color: #F4EFE3;
  font-family: var(--font-brush); font-size: 30px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--cinnabar) 22%, transparent); }
.dot:hover { box-shadow: 0 0 0 9px color-mix(in srgb, var(--cinnabar) 26%, transparent); }

.toast { position: fixed; left: 50%; top: calc(24px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 16px;
  background: var(--ink); color: #F4EFE3; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }

/* the mounted label */
.panel { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 290px; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--rule); border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
.panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 18px 10px; border-bottom: 1px solid var(--rule); }
.panel header h2 { margin: 0; font-family: var(--font-brush); font-weight: 400; font-size: 24px; }
.catalogue { font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.panel .body { overflow-y: auto; padding: 6px 18px 16px; display: flex; flex-direction: column; gap: 15px; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
legend { padding: 0; margin-bottom: 7px; font-size: 12px; font-weight: 600; letter-spacing: .18em; color: var(--ink-soft); }
.choices { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); border: 1px solid var(--ink); }
.choices button { appearance: none; border: 0; border-left: 1px solid var(--ink); background: transparent; color: var(--ink);
  font-family: var(--font-body); font-size: 14px; padding: 7px 0; cursor: pointer; }
.choices button:first-child { border-left: 0; }
.choices button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.choices button[aria-pressed="true"]::after { content: "·"; color: var(--cinnabar); margin-left: 2px; }
.row { display: grid; grid-template-columns: 3.4em 1fr 3.2em; align-items: center; gap: 10px; font-size: 14px; }
.row output { font-family: var(--font-data); font-size: 12px; text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(var(--mineral), var(--mineral)) 0/var(--fill, 50%) 100% no-repeat, var(--rule); }
input[type=range]::-moz-range-track { height: 2px; background: var(--rule); }
input[type=range]::-moz-range-progress { height: 2px; background: var(--mineral); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -8px; background: var(--ink); border-radius: 1px; }
input[type=range]::-moz-range-thumb { width: 12px; height: 18px; background: var(--ink); border: 0; border-radius: 1px; }
.text { display: grid; grid-template-columns: 3.4em 1fr; align-items: center; gap: 10px; font-size: 14px; }
.text input { font-family: var(--font-body); font-size: 14px; padding: 5px 8px; border: 1px solid var(--rule); border-bottom-color: var(--ink);
  background: transparent; color: var(--ink); min-width: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions button, .toggle { appearance: none; font-family: var(--font-body); font-size: 14px; padding: 8px 6px; cursor: pointer;
  background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.actions button:hover, .choices button:hover:not([aria-pressed="true"]) { background: var(--paper-deep); }
.actions button.rec { border-color: var(--cinnabar); color: var(--cinnabar); }
.actions button.rec[aria-pressed="true"] { background: var(--cinnabar); color: #F4EFE3; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }
.note { font-size: 12px; line-height: 1.7; color: var(--ink-soft); margin: 0; }
.toggle { display: none; }

@media (max-width: 720px) {
  .title h1 { font-size: 34px; }
  .byline { display: none; }
  .panel { top: auto; left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 56%; }
  .panel.closed .body { display: none; }
  .toggle { display: inline-block; padding: 4px 12px; font-size: 13px; }
  body.sleeping .panel { display: none; }
}
@media (prefers-reduced-motion: reduce) { body.sleeping #ring { animation: none; } .panel { backdrop-filter: none; -webkit-backdrop-filter: none; } }
</style>
</head>
<body class="sleeping">
<div id="stage" aria-label="水墨墨龙场景"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="ring" aria-hidden="true"></div>
<div class="title"><h1>山水墨龙</h1><div class="seal" aria-hidden="true">墨</div></div>
<p class="byline">拖动画面转换视角，滚轮或双指缩放。龙、山、云和风雨雷声全部由代码现场生成，不用任何外部模型和音频。</p>
<div class="intro">
  <p>墨龙已成，只差点睛<small>点龙眼，或点下面的朱砂（有声音）</small></p>
  <button class="dot" id="dotEye" aria-label="为墨龙点睛">点睛</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<aside class="panel" id="panel">
  <header>
    <h2>调墨</h2>
    <span class="catalogue" id="catalogue">龙谱 0731 · 山图 0008</span>
    <button class="toggle" id="toggle" aria-expanded="false" aria-controls="panelBody">展开</button>
  </header>
  <div class="body" id="panelBody">
    <fieldset>
      <legend>玩法</legend>
      <div class="choices" style="--n: 2" id="modes">
        <button id="modePatrol" data-mode="patrol" aria-pressed="true">巡山</button>
        <button id="modePearl" data-mode="pearl" aria-pressed="false">戏珠</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>视角</legend>
      <div class="choices" id="views">
        <button id="viewChase" data-view="chase" aria-pressed="true">跟拍</button>
        <button id="viewWide" data-view="wide" aria-pressed="false">远观</button>
        <button id="viewFree" data-view="free" aria-pressed="false">自由</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>时辰</legend>
      <div class="choices" style="--n: 4" id="times">
        <button id="timeDawn" data-time="dawn" aria-pressed="false">晨</button>
        <button id="timeDay" data-time="day" aria-pressed="true">昼</button>
        <button id="timeDusk" data-time="dusk" aria-pressed="false">暮</button>
        <button id="timeNight" data-time="night" aria-pressed="false">夜</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>天气</legend>
      <div class="choices" style="--n: 4" id="weathers">
        <button id="wxClear" data-weather="clear" aria-pressed="true">晴</button>
        <button id="wxRain" data-weather="rain" aria-pressed="false">雨</button>
        <button id="wxSnow" data-weather="snow" aria-pressed="false">雪</button>
        <button id="wxThunder" data-weather="thunder" aria-pressed="false">雷</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>设色</legend>
      <div class="choices" id="palettes">
        <button id="palQinglv" data-palette="qinglv" aria-pressed="true">青绿</button>
        <button id="palShuimo" data-palette="shuimo" aria-pressed="false">水墨</button>
        <button id="palQianjiang" data-palette="qianjiang" aria-pressed="false">浅绛</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>龙</legend>
      <label class="row" for="length">身长 <input id="length" type="range" min="18" max="46" step="1" value="30"><output for="length">30</output></label>
      <label class="row" for="girth">粗细 <input id="girth" type="range" min="0.7" max="1.6" step="0.05" value="1.15"><output for="girth">1.15</output></label>
      <label class="row" for="antler">鹿角 <input id="antler" type="range" min="0.4" max="1.6" step="0.05" value="1"><output for="antler">1.00</output></label>
      <label class="row" for="fur">鬃毛 <input id="fur" type="range" min="0.1" max="1.4" step="0.05" value="1"><output for="fur">1.00</output></label>
    </fieldset>
    <fieldset>
      <legend>风云</legend>
      <label class="row" for="speed">飞速 <input id="speed" type="range" min="0" max="30" step="1" value="14"><output for="speed">14</output></label>
      <label class="row" for="wind">风力 <input id="wind" type="range" min="0" max="2.5" step="0.1" value="1"><output for="wind">1.0</output></label>
      <label class="row" for="mist">云雾 <input id="mist" type="range" min="0" max="1" step="0.05" value="0.6"><output for="mist">0.60</output></label>
    </fieldset>
    <fieldset>
      <legend>留影</legend>
      <label class="text" for="signature">落款 <input id="signature" type="text" maxlength="10" placeholder="存图时题在画上" autocomplete="off"></label>
      <div class="actions">
        <button id="snap">存一张图</button>
        <button id="record" class="rec" aria-pressed="false">录六秒</button>
        <button id="share">复制链接</button>
        <button id="sound" aria-pressed="true">声音 开</button>
      </div>
    </fieldset>
    <div class="actions">
      <button id="newDragon">换一条龙</button>
      <button id="newLand">换一片山</button>
      <button id="pause" aria-pressed="false">定格</button>
      <button id="resleep">让它再睡</button>
    </div>
    <p class="note">龙按曲线建模法用代码搭出，身体沿龙头飞过的轨迹游动；风声、龙吟、雨雷、琴音都由浏览器现场合成。网址里记着这条龙和这片山，复制给别人，看到的是同一幅画。</p>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
THREE.ColorManagement.enabled = false; // colours below are written as seen (sRGB) and shaders output them unchanged

// ------------------------------------------------------------------ palettes (sRGB hex)
const PALETTES = {
  qinglv:    { paper: '#EEF1EE', zenith: '#C3D2DA', horizon: '#F1F4F3', cloud: '#FBFCFB', feet: '#1F7D86', middle: '#3E8FB0', top: '#7A66E6',
               ink: '#16294A', highlight: '#DCEBEE', haze: '#D9DDF0', moon: '#E58C82' },
  shuimo:    { paper: '#F0EEE8', zenith: '#D6D8D4', horizon: '#F2F1EC', cloud: '#FAF9F5', feet: '#8E9499', middle: '#5D6368', top: '#2B2E33',
               ink: '#121316', highlight: '#E9EAE6', haze: '#E4E3DE', moon: '#EFE9DA' },
  qianjiang: { paper: '#F2EADA', zenith: '#DCCFB6', horizon: '#F4ECDD', cloud: '#FBF6EC', feet: '#B49B78', middle: '#8C6F55', top: '#5A4334',
               ink: '#231A14', highlight: '#F4E9D3', haze: '#EBDFC9', moon: '#E58C82' },
};
const DRAGON_INK = '#141418';

// ------------------------------------------------------------------ seeded randomness
function rngFrom(seed) {
  let a = seed >>> 0;
  const next = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return { random: next, uniform: (lo, hi) => lo + (hi - lo) * next(), normal: () => Math.sqrt(-2 * Math.log(next() + 1e-9)) * Math.cos(6.283185 * next()) };
}

// ------------------------------------------------------------------ shared GLSL
const NOISE = `
float hash3(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= .5; } return s / .97; }
float dither(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(.06711056, .00583715)))); }
`;

// ------------------------------------------------------------------ renderer, scene, cameras
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .5, 3000);

const state = { view: 'chase', mode: 'patrol', palette: 'qinglv', time: 'day', weather: 'clear', awake: false,
                length: 30, girth: 1.15, antler: 1, fur: 1, speed: 14, wind: 1, mist: .6, dragonSeed: 731, landSeed: 8, paused: false };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const col = hex => { const c = new THREE.Color(hex); return new THREE.Vector3(c.r, c.g, c.b); };

// ------------------------------------------------------------------ sky dome and moon
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uZenith: { value: new THREE.Vector3() }, uHorizon: { value: new THREE.Vector3() }, uCloud: { value: new THREE.Vector3() }, uTime: { value: 0 },
              uStars: { value: 0 }, uStorm: { value: 0 }, uFlash: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: NOISE + `uniform vec3 uZenith, uHorizon, uCloud; uniform float uTime, uStars, uStorm, uFlash; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = clamp(d.y, -.2, 1.);
      vec3 c = mix(uHorizon, uZenith, smoothstep(.02, .6, h));
      vec2 q = d.xz / (max(d.y, 0.) + .22) * 1.4 + vec2(uTime * .006, 0.);
      float n = fbm(vec3(q, 1.7));
      c = mix(c, uCloud, smoothstep(.5 - uStorm * .25, .72 - uStorm * .2, n) * smoothstep(-.02, .2, d.y) * .8);
      vec3 cell = floor(d * 260.);
      float star = step(.9975, hash3(cell)) * smoothstep(.05, .3, d.y) * (1. - smoothstep(.5, .72, n));
      c += uStars * star * vec3(.85, .86, .9);
      c = mix(c, c * vec3(.62, .64, .68), uStorm);           // overcast for rain, snow and storms
      c = mix(c, vec3(1.), uFlash);                          // lightning
      gl_FragColor = vec4(c, 1.); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);

function moonTexture(hex) {
  const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const r = size * .22;
  const halo = g.createRadialGradient(size / 2, size / 2, r * .9, size / 2, size / 2, size / 2);
  halo.addColorStop(0, hex + '66'); halo.addColorStop(1, hex + '00');
  g.fillStyle = halo; g.fillRect(0, 0, size, size);
  g.fillStyle = hex; g.beginPath(); g.arc(size / 2, size / 2, r, 0, Math.PI * 2); g.fill();
  const rng = rngFrom(21);
  for (let i = 0; i < 14; i++) { // faint maria
    const a = rng.uniform(0, 6.28), d = rng.uniform(0, r * .7), s = rng.uniform(r * .08, r * .3);
    g.fillStyle = 'rgba(80,40,40,.06)'; g.beginPath(); g.arc(size / 2 + Math.cos(a) * d, size / 2 + Math.sin(a) * d, s, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; return t;
}
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTexture('#E58C82'), depthWrite: false, fog: false }));
moon.scale.set(150, 150, 1);
scene.add(moon);
const MOON_DIR = new THREE.Vector3(-.55, .32, -.77).normalize();

// ------------------------------------------------------------------ peak field
const FIELD = { half: 200, n: 300 };
const mountainMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { uFeet: { value: new THREE.Vector3() }, uMiddle: { value: new THREE.Vector3() }, uTop: { value: new THREE.Vector3() },
              uInk: { value: new THREE.Vector3() }, uHigh: { value: new THREE.Vector3() }, uHaze: { value: new THREE.Vector3() },
              uFog: { value: .38 }, uLight: { value: new THREE.Vector3(1, 1, 1) } },
  vertexShader: `attribute float rel; attribute float ridge; attribute float cavity;
    varying float vRel, vRidge, vCavity; varying vec3 vNormal, vView, vWorld;
    void main(){ vRel = rel; vRidge = ridge; vCavity = cavity; vWorld = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.); vView = mv.xyz; vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: NOISE + `uniform vec3 uFeet, uMiddle, uTop, uInk, uHigh, uHaze, uLight; uniform float uFog;
    varying float vRel, vRidge, vCavity; varying vec3 vNormal, vView, vWorld;

document.querySelectorAll('#palettes button').forEach(b => b.addEventListener('click', () => { state.palette = b.dataset.palette; press('palettes', 'palette', state.palette); applyLook(); writeHash(); pluckNext(); }));
document.querySelectorAll('#times button').forEach(b => b.addEventListener('click', () => { state.time = b.dataset.time; press('times', 'time', state.time); applyLook(); writeHash(); pluckNext(); }));
document.querySelectorAll('#weathers button').forEach(b => b.addEventListener('click', () => { state.weather = b.dataset.weather; press('weathers', 'weather', state.weather); applyLook(); writeHash(); Sound.init(); nextBolt = clock + 1.2; }));
let rebuild = 0;
const formats = { length: v => v.toFixed(0), girth: v => v.toFixed(2), antler: v => v.toFixed(2), fur: v => v.toFixed(2), speed: v => v.toFixed(0), wind: v => v.toFixed(1), mist: v => v.toFixed(2) };
for (const key of Object.keys(formats)) {
  const input = $(key), out = input.nextElementSibling;
  const sync = () => { const v = parseFloat(input.value); state[key] = v; out.textContent = formats[key](v);
    input.style.setProperty('--fill', ((v - input.min) / (input.max - input.min) * 100) + '%');
    if (['length', 'girth', 'antler', 'fur'].includes(key)) { clearTimeout(rebuild); rebuild = setTimeout(() => { makeDragon(); if (motion.phase === 'sleeping') coilTrail(); rebuildTable(); }, 140); }
    if (key === 'mist') applyLook(); };
  input.addEventListener('input', sync); sync();
}
$('newDragon').addEventListener('click', () => { state.dragonSeed = Math.floor(Math.random() * 9000) + 100; makeDragon(); if (motion.phase === 'sleeping') coilTrail(); rebuildTable(); writeHash(); pluckNext(); });
$('newLand').addEventListener('click', () => { state.landSeed = Math.floor(Math.random() * 9000) + 100; buildField(state.landSeed); buildPath(state.landSeed); if (motion.phase === 'flying') motion.pathS = nearestPathS(motion.head); chase.ready = false; updateCatalogue(); writeHash(); pluckNext(); });
$('pause').addEventListener('click', e => { state.paused = !state.paused; e.currentTarget.setAttribute('aria-pressed', String(state.paused)); e.currentTarget.textContent = state.paused ? '续飞' : '定格'; });
$('resleep').addEventListener('click', sleepAgain);
$('dotEye').addEventListener('click', awaken);
$('snap').addEventListener('click', () => { snapPending = true; });
$('record').addEventListener('click', startRecording);
$('share').addEventListener('click', async () => { writeHash(); try { await navigator.clipboard.writeText(location.href); toast('链接已复制，打开就是这条龙'); } catch (e) { toast('复制失败，请手动复制地址栏'); } });
$('sound').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); e.currentTarget.textContent = on ? '声音 开' : '声音 关'; Sound.init(); Sound.setEnabled(on); });
$('toggle').addEventListener('click', e => { const panel = $('panel'); const open = panel.classList.toggle('closed') === false;
  e.currentTarget.setAttribute('aria-expanded', String(open)); e.currentTarget.textContent = open ? '收起' : '展开'; });
if (matchMedia('(max-width: 720px)').matches) $('panel').classList.add('closed');
else { $('toggle').setAttribute('aria-expanded', 'true'); $('toggle').textContent = '收起'; }

// ------------------------------------------------------------------ run
readHash();
press('palettes', 'palette', state.palette); press('times', 'time', state.time); press('weathers', 'weather', state.weather);
buildField(state.landSeed); buildPath(state.landSeed); makeDragon(); coilTrail(); rebuildTable(); applyLook(); resize();
setMode(state.mode);
if (state.awake) { // a shared link that was already awake opens flying
  dragonUniforms.uDotted.value = 1; motion.phase = 'flying'; motion.pathS = nearestPathS(motion.head);
  motion.vel.set(1, .2, 0).normalize().multiplyScalar(state.speed); document.body.classList.remove('sleeping');
}
let last = performance.now(), clock = 0;
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (!state.paused) { motionClock += dt; steer(dt); }
  if (state.mode === 'pearl') { pearl.position.lerp(pearlGoal, 1 - Math.exp(-dt * 6)); const s = 9 + Math.sin(clock * 5) * .8; pearl.scale.set(s, s, 1);
    if (motion.phase === 'flying' && motion.head.distanceTo(pearl.position) < 7 && clock - caughtAt > 2.5) { caughtAt = clock; Sound.chime(); } }
  rebuildTable();
  bendDragon(motionClock);
  placeCamera(dt, clock);
  skyMat.uniforms.uTime.value = clock; cloudLayers.forEach(m => { m.material.uniforms.uTime.value = clock; });
  if ((state.weather === 'thunder') && clock > nextBolt) { lightning(fx.width, fx.height); nextBolt = clock + 4 + Math.random() * 6; }
  flash = Math.max(0, flash - dt * 2.4); skyMat.uniforms.uFlash.value = flash * .8;
  shake = Math.max(0, shake - dt * 1.8);
  const sx = shake > 0 && !reduceMotion ? (Math.sin(clock * 83) * 14 * shake) : 0, sy = shake > 0 && !reduceMotion ? (Math.cos(clock * 61) * 10 * shake) : 0;
  const offset = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`; stage.style.transform = offset; fx.style.transform = offset;
  sky.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(sunDir, 900);
  renderer.render(scene, camera);
  fxg.clearRect(0, 0, fx.width, fx.height);
  drawWeather(dt, fx.width, fx.height);
  fxg.save(); fxg.scale(fx.width / innerWidth, fx.height / innerHeight); drawBursts(); fxg.restore();
  drawBolts();
  if (motion.phase === 'sleeping') { const e = eyeScreen(); const ring = $('ring'); ring.style.left = e.x + 'px'; ring.style.top = e.y + 'px'; }
  Sound.update(clock, state.wind, state.speed, state.weather, motion.phase === 'sleeping');
  if (snapPending) { snapPending = false; finishSnap(); }
  tickRecording();
  requestAnimationFrame(tick);
}
let motionClock = 0;
requestAnimationFrame(tick);
})();
</script>
